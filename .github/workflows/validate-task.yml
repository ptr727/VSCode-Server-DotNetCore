name: Validate task

# The validation gate: lint the docs and workflows (markdownlint, cspell, actionlint). No unit tests or C#
# formatting - this repo has no compiled code. Reused by test-pull-request (produces the required check) and
# the publish run, so the CI and publish gates are identical.
on:
  workflow_call:
    inputs:
      # Git ref to validate (empty = default checkout ref). The publisher passes its trigger branch so the
      # publish run validates the branch it publishes.
      ref:
        required: false
        type: string
        default: ''

jobs:

  lint:
    name: Lint job
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code step
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}

      - name: Lint markdown step
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
        with:
          globs: '**/*.md'

      # Spell-check the user-facing docs; word list + exclusions live in cspell.json (shared with the editor).
      - name: Spell check step
        uses: streetsidesoftware/cspell-action@e0668cf020899e887ee8ad4d173c31738a79eae8 # v9.0.1
        with:
          files: |
            README.md
            HISTORY.md
          incremental_files_only: false

      # Lint workflow YAML (actionlint bundles shellcheck).
      - name: Lint workflows step
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

      - name: Check EditorConfig step
        run: docker run --rm -v "$PWD":/check --workdir /check mstruebing/editorconfig-checker:latest
