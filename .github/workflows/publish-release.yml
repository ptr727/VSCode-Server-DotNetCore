name: Publish project release action

# Thin caller: the release chain is the hub's reusable build-release-task.yml, which every release repo reaches rather than carries.
# Merges do not publish: the weekly schedule rebuilds main to pick up base-image updates, and a dispatch publishes the branch it runs from.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * MON'

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

# GITHUB_TOKEN gets no scope by default, and each job below grants only what its hub task writes with.
permissions: {}

jobs:

  # Single source of the release-gate decision (publish or not, stable or not), reused by every job below.
  plan:
    name: Plan release job
    uses: ptr727/ProjectTemplate/.github/workflows/publish-plan-task.yml@456694681ae76ff162a9bd784b5376901957feae # 2.0.685
    with:
      event_name: ${{ github.event_name }}
      actor: ${{ github.actor }}
      ref_name: ${{ github.ref_name }}

  # The same reusable gate CI runs, on the branch tip, running only when a publish will happen.
  validate:
    name: Validate job
    needs: [plan]
    if: ${{ needs.plan.outputs.publish == 'true' }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@456694681ae76ff162a9bd784b5376901957feae # 2.0.685
    permissions:
      contents: read

  publish:
    name: Publish project release job
    needs: [plan, validate]
    if: ${{ needs.plan.outputs.publish == 'true' && needs.validate.result == 'success' }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@456694681ae76ff162a9bd784b5376901957feae # 2.0.685
    permissions:
      contents: write
      actions: write
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      smoke: false
      github: true
      dockerhub: true
      enable_docker: true
      enable_dotnet_publish: false
      enable_nuget: false
      enable_pypi: false
      expect_release_assets: false
      docker_image: ptr727/vscode-server-dotnetcore

  # The task pushes only for main, so a develop publish leaves the one overview untouched.
  publish-docker-readme:
    name: Publish Docker Hub readme job
    needs: [plan, publish]
    if: ${{ needs.plan.outputs.publish == 'true' && needs.publish.result == 'success' }}
    uses: ptr727/ProjectTemplate/.github/workflows/publish-docker-readme-task.yml@456694681ae76ff162a9bd784b5376901957feae # 2.0.685
    permissions:
      contents: read
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      ref: ${{ github.sha }}
      branch: ${{ github.ref_name }}
      repositories: '["ptr727/vscode-server-dotnetcore"]'
