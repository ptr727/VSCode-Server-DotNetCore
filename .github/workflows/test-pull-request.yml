name: Test pull request action

# Thin caller: the lint gate and the smoke build are the hub's reusable validate-task.yml and build-release-task.yml.
# CI runs on push to every branch with no paths filter, so a pull request tests its own head, and a fork contribution lands on an in-repo branch before merging.
on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  # A branch-deletion push carries an all-zero SHA that nothing can check out, so every job skips it.
  validate:
    name: Validate job
    if: ${{ !github.event.deleted }}
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@456694681ae76ff162a9bd784b5376901957feae # 2.0.685
    permissions:
      contents: read

  # Never publishes and never pushes: smoke builds linux/amd64 only.
  smoke-build:
    name: Smoke build job
    if: ${{ !github.event.deleted }}
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@456694681ae76ff162a9bd784b5376901957feae # 2.0.685
    permissions:
      contents: read
    # The task logs in to Docker Hub on every build for the higher rate limit.
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      smoke: true
      github: false
      dockerhub: false
      branch: ${{ github.ref_name }}
      enable_docker: true
      enable_dotnet_publish: false
      enable_nuget: false
      enable_pypi: false
      expect_release_assets: false
      docker_image: ptr727/vscode-server-dotnetcore

  # Required checks cannot bind a conditional job, so this always-run aggregator is the ruleset-bound status check.
  # Its name is the ruleset context: rename it and the ruleset together.
  check-workflow-status:
    name: Check pull request workflow status job
    runs-on: ubuntu-latest
    needs: [validate, smoke-build]
    if: ${{ always() && !github.event.deleted }}
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "validate:${{ needs.validate.result }}" "smoke-build:${{ needs.smoke-build.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
