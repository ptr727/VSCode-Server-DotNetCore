name: Test pull request action

# Thin caller: the lint gate and the smoke build are the hub's reusable validate-task.yml and build-release-task.yml.
# The Dockerfile is the only build input, and nearly every change reaches the image.
# So the smoke build runs on every pull request with no paths filter.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:

  validate:
    name: Validate job
    uses: ptr727/ProjectTemplate/.github/workflows/validate-task.yml@df04adaee6c5928177535e40eb5b9310638f501e # 2.0.1343
    permissions:
      contents: read

  # Never publishes and never pushes: smoke builds linux/amd64 only.
  smoke-build:
    name: Smoke build job
    uses: ptr727/ProjectTemplate/.github/workflows/build-release-task.yml@df04adaee6c5928177535e40eb5b9310638f501e # 2.0.1343
    permissions:
      contents: read
    # The task logs in to Docker Hub on every build for the higher rate limit.
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
    with:
      smoke: true
      github: false
      dockerhub: false
      # On a pull_request event github.ref_name is the PR ref (for example 123/merge), never the target branch.
      # The logical branch therefore reads base_ref first and falls back to ref_name on a dispatch.
      branch: ${{ github.base_ref || github.ref_name }}
      enable_docker: true
      enable_dotnet_publish: false
      enable_nuget: false
      enable_pypi: false
      expect_release_assets: false
      docker_image: ptr727/vscode-server-dotnetcore

  # Required checks cannot bind a conditional job, so this always-run aggregator is the ruleset-bound status check.
  # Its name is the ruleset context: rename it and the ruleset together.
  # Only a pull_request run takes the ruleset-bound name (D1.5).
  # So a dispatch on a pull request's head cannot post the required check without that pull request's gates.
  check-workflow-status:
    name: ${{ github.event_name == 'pull_request' && 'Check pull request workflow status job' || 'Check workflow status job' }}
    runs-on: ubuntu-latest
    needs: [validate, smoke-build]
    if: always()
    steps:
      - name: Check workflow results step
        run: |
          set -Eeuo pipefail
          for result in "validate:${{ needs.validate.result }}" "smoke-build:${{ needs.smoke-build.result }}"; do
            name="${result%%:*}"
            value="${result#*:}"
            if [[ "$value" != "success" ]]; then
              echo "::error::Job '$name' did not succeed ($value)."
              exit 1
            fi
          done
